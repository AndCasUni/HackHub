# Configurazione Database H2 (Salvato su un file fisico nella cartella del progetto)

spring.datasource.url=jdbc:h2:file:${user.dir}/hackhub_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# "update" crea il database la prima volta, e poi lo AGGIORNA senza cancellare i dati
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (visibile su http://localhost:8080/h2-console)
spring.h2.console.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true